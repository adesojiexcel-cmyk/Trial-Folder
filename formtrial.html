<!DOCTYPE html>

<head>

<body>
    <main>
        <div id="main container">
    <header>
        <h1>Registration form</h1>
        <p>please fill out this form with the required information</p>

            <label for="enter your first name">enter your first name:</label> <br>

            <label for="enter your last name">Enter your last name:</label> <br>
            <input type="text"> <br><br>

            <label for="enter your new password">Enter your new password:</label><br>
            <input type="text"> <br> <br>
           </div>
        </main>

   

    <section class="account type">

        <input type="radio" name="text" id="business">
        <label for="business:">business:</label><br>

    </section>

    <hr>
    <section class="upload">

        <label for="input your age(years)">input your age(years):</label> <br>
        <input type="number" name="text" id="number"> <br> <br>

       
       <label for="How did you hear about us?">How did you hear about us?:</label> <br>

            <option value="select">FreeCodeCamp youtube channel</option>
            <option value="select">FreeCodeCamp Forum</option>
            <option value="select">others</option> <br> <br>
            
        </select>
    </section>

    <label for="Provide a bio">provide a bio:</label><br>
    <input type="textarea" name="" id="i like coding on the beach..." rows="40" cols="20">

    <p><a href="https://www.tiktok.com/">Read our terms and condition</a></p>

    <input type="checkbox" name="text" id="text">
    <label for="i accept thr terms and condition">i accept the terms and condition</label><br><br>

    <input type="submit" value="submit"/>

</section>
